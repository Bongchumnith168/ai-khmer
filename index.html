const app = document.getElementById('app');
const q = document.getElementById('q');
let activeCat = 'all', query = '';

function esc(s){ return s; }

function cardHTML(a){
  return `<div class="card" onclick="location.hash='#/a/${a.id}'">
    <span class="badge">${CATS[a.cat]}</span>
    <h3>${a.title}</h3>
    <p>${a.excerpt}</p>
    <div class="meta"><span>📅 ${a.date}</span><span>⏱️ ${a.read}</span></div>
  </div>`;
}

function relatedHTML(a){
  const rel = ARTICLES.filter(x => x.id !== a.id && x.cat === a.cat).concat(
    ARTICLES.filter(x => x.id !== a.id && x.cat !== a.cat)
  ).slice(0,3);
  return `<h2>អត្ថបទពាក់ព័ន្ធ</h2><div class="grid">` + rel.map(cardHTML).join('') + `</div>`;
}

function renderHome(){
  const list = ARTICLES.filter(a =>
    (activeCat === 'all' || a.cat === activeCat) &&
    (!query || (a.title + ' ' + a.excerpt + ' ' + a.tags).toLowerCase().includes(query))
  );
  const pills = ['all'].concat(Object.keys(CATS)).map(c =>
    `<button class="pill ${c===activeCat?'active':''}" data-cat="${c}">${c==='all'?'ទាំងអស់':CATS[c]}</button>`
  ).join('');
  app.innerHTML = `
    <section class="hero">
      <h1>រៀន AI ជាភាសាខ្មែរ</h1>
      <p>ឧបករណ៍ឥតគិតថ្លៃ របៀបប្រើជាជំហាន ព័ត៌មាន AI — ឥតគិតថ្លៃ ជាក់ស្តែង ប្រើបានពិតនៅកម្ពុជា។</p>
      <a class="btn" href="#latest">អានអត្ថបទថ្មីៗ</a>
      <a class="btn ghost" href="#/about">អំពីយើង</a>
    </section>
    <div class="pills" id="latest">${pills}</div>
    <div class="grid">${list.length ? list.map(cardHTML).join('') : '<div class="empty">រកមិនឃើញអត្ថបទ — សាកពាក្យផ្សេង។</div>'}</div>
    <section class="newsletter">
      <h2>📬 ទទួលមេរៀន AI ថ្មីៗតាម email</h2>
      <p>អត្ថបទថ្មី ឧបករណ៍ឥតគិតថ្លៃ និង offer ពិសេស — ផ្ញើត្រង់ទៅ inbox របស់អ្នក។</p>
      <form id="nlForm"><input type="email" required placeholder="អ៊ីមែលរបស់អ្នក"><button type="submit">ចុះឈ្មោះ</button></form>
      <div class="form-msg" id="nlMsg"></div>
    </section>`;
  app.querySelectorAll('.pill').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; renderHome(); });
  const f = document.getElementById('nlForm');
  if (f) f.onsubmit = e => {
    e.preventDefault();
    document.getElementById('nlMsg').textContent = 'អរគុណ! ប្រព័ន្ធ newsletter នឹងបើកដំណើរការឆាប់ៗ — តាមដានយើងសិន។';
    f.reset();
  };
}

function renderArticle(id){
  const a = ARTICLES.find(x => x.id === id);
  if (!a){ location.hash = '#/'; return; }
  document.title = a.title + ' — AIខ្មែរ';
  app.innerHTML = `
    <div class="article">
      <a class="back" href="#/">← ត្រឡប់ទៅទំព័រដើម</a>
      <span class="badge">${CATS[a.cat]}</span>
      <h1>${a.title}</h1>
      <div class="meta"><span>📅 ${a.date}</span><span>⏱️ អាន ${a.read}</span></div>
      ${a.body}
      <div class="note"><strong>ចែករំលែក៖</strong> បើអត្ថបទនេះមានប្រយោជន៍ ចែករំលែកឱ្យមិត្តភក្តិបានដឹងផង។</div>
      ${relatedHTML(a)}
    </div>`;
  window.scrollTo(0,0);
}

function renderAbout(){
  document.title = 'អំពីយើង — AIខ្មែរ';
  app.innerHTML = `
    <div class="about">
      <h1>អំពី AIខ្មែរ</h1>
      <p><strong>AIខ្មែរ</strong> ជា website សម្រាប់រៀនប្រើ AI ជាភាសាខ្មែរ — ឥតគិតថ្លៃ ជាក់ស្តែង និងផ្តោតលើអ្វីដែលប្រើបានពិតនៅកម្ពុជា។</p>
      <p>អត្ថបទនីមួយៗអនុវត្តតាមស្តង់ដាររបស់យើង៖ ចំណងជើងច្បាស់ សង្ខេបស្មោះត្រង់នៅខាងដើម ជំហានធ្វើជាក់ស្តែង និងចំណាំពិសេសសម្រាប់កម្ពុជា (តើប្រើបានឬអត់ ត្រូវការ card ឬអត់)។</p>
      <h2 style="margin-top:24px">ស្តង់ដាររបស់យើង</h2>
      <ul>
        <li>ភាសាខ្មែរសាមញ្ញ ងាយយល់ — មិនលាយពាក្យថៃ</li>
        <li>ព័ត៌មានបានផ្ទៀងផ្ទាត់ — មិនសន្យាខុស</li>
        <li>បញ្ជាក់ច្បាស់ពេល AI ជួយសរសេរ</li>
        <li>គិតពីកម្ពុជាជាមុន — eligibility, card, តម្លៃ</li>
      </ul>
      <p style="margin-top:16px">ទំនាក់ទំនង៖ តាមរយៈ YouTube និង Facebook ខាងក្រោម។</p>
    </div>`;
  window.scrollTo(0,0);
}

function route(){
  const h = location.hash;
  if (h.startsWith('#/a/')) renderArticle(h.slice(4));
  else if (h === '#/about') renderAbout();
  else { document.title = 'AIខ្មែរ — រៀន AI ជាភាសាខ្មែរ'; renderHome(); }
}

q.addEventListener('input', () => { query = q.value.trim().toLowerCase(); if(!location.hash.startsWith('#/a/')) renderHome(); });

const themeBtn = document.getElementById('themeBtn');
function setTheme(t){
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '🌙' : '☀️';
  try{ localStorage.setItem('aik-theme', t); }catch(e){}
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
try{ setTheme(localStorage.getItem('aik-theme') || 'dark'); }catch(e){ setTheme('dark'); }

window.addEventListener('hashchange', route);
route();
</script>
